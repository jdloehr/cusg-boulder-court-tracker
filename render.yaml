# Render Blueprint (https://render.com/docs/blueprint-spec) for the
# backend + Postgres. Deploy: push this repo to GitHub, then in Render
# "New +" -> "Blueprint" -> point at the repo. Render reads this file and
# creates both resources below in one step.
#
# The frontend is NOT deployed here -- it goes to Vercel/Netlify as a
# separate static-site deploy (see docs/DEPLOYMENT.md), per the build
# prompt's own Section 7 hosting suggestion.
databases:
  - name: cusg-court-tracker-db
    plan: free
    region: oregon

services:
  - type: web
    name: cusg-court-tracker-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cusg-court-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Oct 2026 review item 8: this used to be "1" -- running the
      # in-process APScheduler (app/jobs/scheduler.py) *and* the
      # GitHub Actions cron workflow (.github/workflows/scheduled-
      # jobs.yml) against the same production database meant every
      # scheduled job (docket pull, news search, the weekly digest,
      # the Google Calendar sync) ran twice a day -- duplicate digest
      # emails to every subscriber being the most visible symptom.
      # GitHub Actions already runs all of them; this app process
      # doesn't need to as well.
      - key: ENABLE_SCHEDULER
        value: "0"
      # Oct 2026 review item 8: disables the interactive API docs
      # (app/main.py) and turns on the startup check in app/config.py
      # that refuses to boot if JWT_SECRET or
      # GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY below are still their
      # committed placeholder defaults -- see the human checklist in
      # docs/DEPLOYMENT.md before this is synced to the live service.
      - key: ENVIRONMENT
        value: production
      # Required once ENVIRONMENT=production (see above) if Google
      # Calendar sync is in use at all -- sync: false means Render
      # won't overwrite a value set by hand in the dashboard, and
      # won't generate one automatically either (unlike JWT_SECRET
      # above): a real Fernet key (Fernet.generate_key()) has to be
      # generated and entered once, by a human, same as
      # COURTLISTENER_API_TOKEN below.
      - key: GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY
        sync: false
      # Optional, enables CourtListener RECAP/docket-level queries -- see
      # docs/DATA_SOURCE_FINDINGS.md section 5. Leave unset to use the
      # free, token-less search endpoints only.
      - key: COURTLISTENER_API_TOKEN
        sync: false
