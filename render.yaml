# Render Blueprint (https://render.com/docs/blueprint-spec) for the
# backend + Postgres. Deploy: push this repo to GitHub, then in Render
# "New +" -> "Blueprint" -> point at the repo. Render reads this file and
# creates both resources below in one step.
#
# The frontend is NOT deployed here -- it goes to Vercel/Netlify as a
# separate static-site deploy (see docs/DEPLOYMENT.md), per the build
# prompt's own Section 7 hosting suggestion.
databases:
  - name: cusg-court-tracker-db
    plan: free
    region: oregon

services:
  - type: web
    name: cusg-court-tracker-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cusg-court-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "1"
      # Optional, enables CourtListener RECAP/docket-level queries -- see
      # docs/DATA_SOURCE_FINDINGS.md section 5. Leave unset to use the
      # free, token-less search endpoints only.
      - key: COURTLISTENER_API_TOKEN
        sync: false
